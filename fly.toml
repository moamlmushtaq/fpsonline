# HALCYON FRONT — Fly.io app config (https://fly.io/docs/reference/configuration/)
# Deploy:  fly launch --no-deploy --copy-config   (pick an app name / region)
#          fly deploy
# Game servers hold live matches in memory, so machines must never auto-stop.

app = "halcyon-front"
primary_region = "fra"
kill_signal = "SIGTERM"
kill_timeout = "10s"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  HOST = "0.0.0.0"
  TRUST_PROXY = "1"
  DATA_DIR = "/app/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  # WebSockets are long-lived connections: count connections, not requests.
  [http_service.concurrency]
    type = "connections"
    soft_limit = 800
    hard_limit = 1000

  [[http_service.checks]]
    grace_period = "15s"
    interval = "15s"
    timeout = "3s"
    method = "GET"
    path = "/healthz"

  [[http_service.checks]]
    grace_period = "15s"
    interval = "60s"
    timeout = "3s"
    method = "GET"
    path = "/api/status"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# Persistent accounts: create a volume and mount it over the data dir, e.g.
#   fly volumes create halcyon_data --size 1 --region fra
# then uncomment below. Fly volumes are root-owned; once after the first deploy run
#   fly ssh console -C "chown -R 1000:1000 /app/data"
# (the server runs as the non-root `node` user; without write access it logs a
#  warning and keeps accounts in memory only).
# [[mounts]]
#   source = "halcyon_data"
#   destination = "/app/data"
