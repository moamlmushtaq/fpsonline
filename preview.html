<!doctype html>
<!-- HALCYON FRONT — dev-only preview harness (not part of the production build).
     Serve with `npx vite --port 5173` and open /preview.html?view=map&map=gantry
     See src/client/dev/preview.ts for all URL parameters. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>HALCYON FRONT — Preview</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1b1917;
        overflow: hidden;
        font: 12px/1.4 ui-monospace, Menlo, monospace;
        color: #f3ece0;
      }
      #stage {
        position: fixed;
        inset: 0;
      }
      canvas#c {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #hud {
        position: fixed;
        left: 8px;
        top: 6px;
        opacity: 0.7;
        pointer-events: none;
        white-space: pre;
        text-shadow: 0 1px 2px #000;
      }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="c"></canvas></div>
    <div id="hud"></div>
    <script type="module" src="/src/client/dev/preview.ts"></script>
  </body>
</html>
